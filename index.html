<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Earn BD</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1c2733;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #24303f;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .score-board {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            background: #17212b;
            padding: 10px;
            border-radius: 8px;
        }
        .question-box {
            font-size: 18px;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #2b5278;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option-btn:hover {
            background-color: #3b6e9e;
        }
        .ad-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }
        .ad-btn:hover {
            background-color: #00aaff;
        }
        .withdraw-section {
            background-color: #17212b;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        .withdraw-section input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #2b5278;
            background: #24303f;
            color: #fff;
            text-align: center;
        }
        .withdraw-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .withdraw-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .bkash-btn { background-color: #e2136e; }
        .nagad-btn { background-color: #f7921e; }
        .ad-notice {
            display: none;
            background: #0088cc;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>QuizEarn BD</h2>
    
    <div class="score-board">
        পয়েন্ট: <span id="score">0</span> | কুইজ: <span id="quiz-count">1</span>
    </div>

    <div id="ad-notice" class="ad-notice">
        বিজ্ঞাপন লোড হচ্ছে... ৫ সেকেন্ড অপেক্ষা করুন!
    </div>

    <div class="question-box" id="question">
        প্রশ্ন লোড হচ্ছে...
    </div>

    <div class="options-grid" id="options-container"></div>

    <button class="ad-btn" onclick="openMonetagAd(50)">বিজ্ঞাপন দেখুন (৫০ পয়েন্ট)</button>

    <!-- উইথড্র সেকশন -->
    <div class="withdraw-section">
        <h3>টাকা উত্তোলন (Withdraw)</h3>
        <p style="font-size: 12px; color: #aaa;">সর্বনিম্ন ২০০০ পয়েন্ট = ১০০ টাকা</p>
        <input type="number" id="phone-number" placeholder="মোবাইল নম্বর লিখুন">
        <div class="withdraw-btn-group">
            <button class="withdraw-btn bkash-btn" onclick="requestWithdraw('bKash')">বিকাশ (bKash)</button>
            <button class="withdraw-btn nagad-btn" onclick="requestWithdraw('Nagad')">নগদ (Nagad)</button>
        </div>
    </div>
</div>

<script>
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
    }

    // আপনার Monetag ডিরেক্ট লিংক
    const MONETAG_DIRECT_LINK = "https://omg10.com/4/11670353";

    const quizData = [
        { question: "বাংলাদেশের একমাত্র প্রবাল দ্বীপ কোনটি?", options: ["সেন্ট মার্টিন", "মহেশখালী"], correct: 0 },
        { question: "সংবিধান অনুযায়ী বাংলাদেশের আইনসভার নাম কি?", options: ["জাতীয় সংসদ", "গণপরিষদ"], correct: 0 },
        { question: "বিশ্বের সবচেয়ে দীর্ঘতম প্রাকৃতিক সমুদ্র সৈকত কোনটি?", options: ["কক্সবাজার", "কুয়াকাটা"], correct: 0 },
        { question: "বাংলাদেশের সবচেয়ে ছোট প্রশাসনিক বিভাগ কোনটি?", options: ["ময়মনসিংহ", "সিলেট"], correct: 0 },
        { question: "বাংলাদেশ কত সালে জাতিসংঘের সদস্যপদ লাভ করে?", options: ["১৯৭৪ সালে", "১৯৭২ সালে"], correct: 0 },
        { question: "মানবদেহের বৃহত্তম অঙ্গ কোনটি?", options: ["ত্বক (Skin)", "যকৃৎ (Liver)"], correct: 0 },
        { question: "নোবেল পুরস্কার প্রদান শুরু হয় কত সাল থেকে?", options: ["১৯০১ সাল", "১৯০৫ সাল"], correct: 0 },
        { question: "মহাকাশে পাঠানো প্রথম কৃত্রিম উপগ্রহ কোনটি?", options: ["স্পুটনিক-১", "অ্যাপোলো-১১"], correct: 0 },
        { question: "কম্পিউটারের অস্থায়ী মেমোরি (Temporary Memory) কোনটি?", options: ["RAM", "ROM"], correct: 0 },
        { question: "সূর্যের আলোর কোন রশ্মি থেকে ভিটামিন ডি পাওয়া যায়?", options: ["অতিবেগুনি রশ্মি (Ultraviolet)", "ইনফ্রারেড রশ্মি"], correct: 0 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionEl = document.getElementById('question');
    const optionsContainer = document.getElementById('options-container');
    const scoreEl = document.getElementById('score');
    const quizCountEl = document.getElementById('quiz-count');
    const adNotice = document.getElementById('ad-notice');

    function loadQuiz() {
        optionsContainer.innerHTML = '';
        const currentQuiz = quizData[currentQuestionIndex];
        
        questionEl.innerText = (currentQuestionIndex + 1) + ". " + currentQuiz.question;
        quizCountEl.innerText = (currentQuestionIndex + 1) + "/" + quizData.length;

        currentQuiz.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option-btn');
            button.onclick = function() { selectOption(index); };
            optionsContainer.appendChild(button);
        });
    }

    function selectOption(selectedIndex) {
        const currentQuiz = quizData[currentQuestionIndex];
        
        if (selectedIndex === currentQuiz.correct) {
            score += 10;
            scoreEl.innerText = score;
            
            // ৫ সেকেন্ডের অটোমেটিক বিজ্ঞাপন প্রসেস
            adNotice.style.display = 'block';
            setTimeout(() => {
                adNotice.style.display = 'none';
                openMonetagAd(0); // বিজ্ঞাপন পেজে রিডাইরেক্ট
            }, 5000);

            alert("সঠিক উত্তর! ১০ পয়েন্ট যোগ হয়েছে। ৫ সেকেন্ড পর বিজ্ঞাপন আসছে...");
        } else {
            alert("ভুল উত্তর! সঠিক উত্তর ছিল: " + currentQuiz.options[currentQuiz.correct]);
        }

        currentQuestionIndex++;
        
        if (currentQuestionIndex < quizData.length) {
            loadQuiz();
        } else {
            currentQuestionIndex = 0;
            loadQuiz();
        }
    }

    // Monetag বিজ্ঞাপনে নিয়ে যাওয়ার ফাংশন
    function openMonetagAd(bonusPoints = 0) {
        if(bonusPoints > 0) {
            score += bonusPoints;
            scoreEl.innerText = score;
        }

        try {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                window.Telegram.WebApp.openLink(MONETAG_DIRECT_LINK, { try_instant_view: false });
            } else {
                window.open(MONETAG_DIRECT_LINK, '_blank');
            }
        } catch(e) {
            window.location.href = MONETAG_DIRECT_LINK;
        }
    }

    // ২০০০ পয়েন্ট উইথড্র লজিক
    function requestWithdraw(method) {
        const phone = document.getElementById('phone-number').value;

        if (!phone || phone.length < 11) {
            alert("দয়া করে ১১ ডিজিটের সঠিক মোবাইল নম্বর লিখুন!");
            return;
        }

        if (score < 2000) {
            alert("আপনার পর্যাপ্ত পয়েন্ট নেই! সর্বনিম্ন ২০০০ পয়েন্ট লাগবে।");
            return;
        }

        score -= 2000;
        scoreEl.innerText = score;
        alert(`আপনার ${method} উইথড্র রিকোয়েস্ট সফল হয়েছে!\nনম্বর: ${phone}\n২০০০ পয়েন্ট কেটে নেয়া হয়েছে।`);
        document.getElementById('phone-number').value = '';
    }

    window.onload = function() {
        loadQuiz();
    };
</script>

</body>
</html>
