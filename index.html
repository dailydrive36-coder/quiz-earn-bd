<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizEarn BD</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad-index.js"></script>
    <style>
        html, body {
            background-color: #f4f6f9 !important;
            color: #222222 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        .card {
            background: #ffffff !important;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            margin: 0 auto;
            border: 1px solid #e1e8ed;
        }

        h2 {
            margin-top: 0;
            color: #1a1a1a;
            font-size: 22px;
            text-align: center;
        }

        .balance-box {
            background: #eef7ff !important;
            border: 1px solid #bce0fd;
            color: #0056b3 !important;
            padding: 12px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .quiz-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #111;
            margin-bottom: 15px;
        }

        .btn {
            background-color: #28a745;
            color: #ffffff !important;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin: 6px 0;
            font-weight: 600;
        }

        .btn-quiz-opt {
            background-color: #ffffff !important;
            color: #333333 !important;
            border: 1px solid #cccccc;
            text-align: center;
            padding: 12px;
            font-size: 16px;
        }

        .btn-bonus {
            background-color: #ff9800 !important;
        }

        .btn-withdraw {
            background-color: #007bff !important;
        }

        hr {
            border: 0;
            height: 1px;
            background: #e8e8e8;
            margin: 20px 0;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            background-color: #ffffff !important;
            color: #333333 !important;
            box-sizing: border-box;
        }

        .sub-text {
            font-size: 12px;
            color: #777;
            margin-top: -5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>QuizEarn BD</h2>
    
    <div class="balance-box">
        ব্যালেন্স: <span id="user-points">0</span> পয়েন্ট
    </div>

    <!-- কুইজ সেকশন -->
    <div id="quiz-section">
        <div class="quiz-title" id="quiz-number">কুইজ নং: ১ / ১০</div>
        <div class="question-text" id="question-text">প্রশ্ন লোড হচ্ছে...</div>
        <div id="options-container"></div>
    </div>

    <hr>

    <!-- ভিডিও বোনাস -->
    <div>
        <h4 style="margin: 0 0 5px 0;">বোনাস টাস্ক</h4>
        <div class="sub-text">অ্যাড দেখে বোনাস পয়েন্ট অর্জন করুন</div>
        <button class="btn btn-bonus" onclick="showBonusAd()">২০ সেকেন্ডের ভিডিও (১৫ পয়েন্ট)</button>
    </div>

    <hr>

    <!-- উইথড্র অপশন -->
    <div>
        <h4 style="margin: 0 0 5px 0;">টাকা উত্তোলন</h4>
        <div class="sub-text">সর্বনিম্ন উইথড্র: ৩,০০০ পয়েন্ট = ৫০ টাকা</div>
        
        <select id="method">
            <option value="bKash">বিকাশ (bKash)</option>
            <option value="Nagad">নগদ (Nagad)</option>
        </select>
        
        <input type="number" id="phone" placeholder="নম্বর দিন (যেমন: 017XXXXXXXX)">
        <button class="btn btn-withdraw" onclick="withdraw()">উইথড্র করুন</button>
    </div>
</div>

<script>
    let points = 0;
    let currentQuizIndex = 0;

    // Adsgram Controller Integration
    const AdController = window.Adsgram.init({ blockId: "44878" });

    // ১০টি নির্দিষ্ট কুইজ (প্রতিটিতে মাত্র ২টি করে অপশন)
    const quizzes = [
        { q: "১. আমাদের দেশের নাম কি?", options: ["বাংলাদেশ", "ভারত"], ans: 0 },
        { q: "২. বাংলাদেশের রাজধানী কোনটি?", options: ["ঢাকা", "কলকাতা"], ans: 0 },
        { q: "৩. ৫ + ৫ = কত?", options: ["৮", "১০"], ans: 1 },
        { q: "৪. আমাদের জাতীয় ফুল কোনটি?", options: ["শাপলা", "গোলাপ"], ans: 0 },
        { q: "৫. ১০ - ৩ = কত?", options: ["৭", "৫"], ans: 0 },
        { q: "৬. আমাদের জাতীয় ফল কোনটি?", options: ["আম", "কাঁঠাল"], ans: 1 },
        { q: "৭. ৮ x ২ = কত?", options: ["১৬", "১৮"], ans: 0 },
        { q: "৮. সপ্তাহের শেষ দিন কোনটি?", options: ["শুক্রবার", "রবিবার"], ans: 0 },
        { q: "৯. ১৫ / ৩ = কত?", options: ["৪", "৫"], ans: 1 },
        { q: "১০. ১০০ + ২০০ = কত?", options: ["৩০০", "৩৫০"], ans: 0 }
    ];

    function loadQuiz() {
        if (currentQuizIndex >= quizzes.length) {
            currentQuizIndex = 0; // ১০টি শেষ হলে আবার ১ নম্বর থেকে শুরু হবে
        }
        
        const qData = quizzes[currentQuizIndex];
        document.getElementById('quiz-number').innerText = `কুইজ নং: ${currentQuizIndex + 1} / ১০`;
        document.getElementById('question-text').innerText = qData.q;
        
        const optionsDiv = document.getElementById('options-container');
        optionsDiv.innerHTML = '';
        
        qData.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-quiz-opt';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex) {
        const correctIndex = quizzes[currentQuizIndex].ans;
        
        if (selectedIndex === correctIndex) {
            points += 10;
            document.getElementById('user-points').innerText = points;
            alert('সঠিক উত্তর! ১০ পয়েন্ট যোগ হয়েছে।');
        } else {
            alert('ভুল উত্তর! কোনো পয়েন্ট যোগ হয়নি।');
        }

        // উত্তর সঠিক বা ভুল যা-ই হোক, অ্যাড চালু হবে
        AdController.show().then(() => {
            currentQuizIndex++;
            loadQuiz();
        }).catch(() => {
            currentQuizIndex++;
            loadQuiz();
        });
    }

    function showBonusAd() {
        AdController.show().then(() => {
            points += 15;
            document.getElementById('user-points').innerText = points;
            alert('ধন্যবাদ! ভিডিও দেখার জন্য ১৫ পয়েন্ট যোগ হয়েছে।');
        }).catch(() => {
            alert('ভিডিওটি সম্পূর্ণ দেখতে হবে।');
        });
    }

    function withdraw() {
        const phone = document.getElementById('phone').value;
        const method = document.getElementById('method').value;

        if (points < 3000) {
            alert('পয়েন্ট অপর্যাপ্ত! উইথড্র করতে কমপক্ষে ৩,০০০ পয়েন্ট প্রয়োজন।');
            return;
        }
        if (phone.length !== 11) {
            alert('দয়া করে ১১ ডিজিটের সঠিক মোবাইল নম্বর দিন।');
            return;
        }

        alert(`আপনার ${method} নম্বর (${phone})-এ ৫০ টাকা উইথড্র রিকোয়েস্ট সফলভাবে জমা হয়েছে!`);
        points -= 3000;
        document.getElementById('user-points').innerText = points;
    }

    // স্ক্রিন লোড হওয়ামাত্র কুইজ চালু করার জন্য
    document.addEventListener("DOMContentLoaded", function() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
        loadQuiz();
    });
</script>
</body>
    </html>
