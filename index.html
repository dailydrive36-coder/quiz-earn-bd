<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizEarn BD</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK Integration -->
    <script src="https://sad.adsgram.ai/js/sad-index.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #f4f6f9 !important;
            color: #222222 !important;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .card {
            background: #ffffff !important;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border: 2px solid #e1e8ed;
        }

        h2 {
            margin-top: 0;
            color: #0d6efd;
            font-size: 24px;
            text-align: center;
            font-weight: bold;
        }

        .balance-box {
            background: #e7f5ff !important;
            border: 2px solid #74c0fc;
            color: #1c7ed6 !important;
            padding: 12px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .quiz-title {
            font-size: 15px;
            color: #d63384;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            color: #212529 !important;
            margin-bottom: 15px;
            background: #fff9db;
            padding: 12px;
            border-radius: 8px;
            border-left: 5px solid #fcc419;
        }

        .btn {
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            font-weight: bold;
            display: block;
            text-align: center;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.98);
        }

        /* কুইজের আকর্ষণীয় কালারফুল উত্তর বাটন */
        .btn-quiz-opt {
            background-color: #e7f5ff !important;
            color: #1971c2 !important;
            border: 2px solid #4dabf7 !important;
            font-size: 17px;
        }

        /* বোনাস ভিডিও বাটন (উজ্জ্বল কমলা) */
        .btn-bonus {
            background: linear-gradient(135deg, #ff922b, #fd7e14) !important;
            color: #ffffff !important;
            box-shadow: 0 4px 10px rgba(253, 126, 20, 0.3);
            font-size: 16px;
        }

        /* উইথড্র বাটন (উজ্জ্বল সবুজ) */
        .btn-withdraw {
            background: linear-gradient(135deg, #40c057, #2b8a3e) !important;
            color: #ffffff !important;
            box-shadow: 0 4px 10px rgba(43, 138, 62, 0.3);
            font-size: 16px;
        }

        hr {
            border: 0;
            height: 1px;
            background: #e9ecef;
            margin: 20px 0;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            border: 2px solid #ced4da;
            border-radius: 8px;
            font-size: 15px;
            background-color: #ffffff !important;
            color: #333333 !important;
        }

        .sub-text {
            font-size: 13px;
            color: #6c757d;
            margin-top: -5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>QuizEarn BD</h2>
    
    <div class="balance-box">
        ব্যালেন্স: <span id="user-points">0</span> পয়েন্ট
    </div>

    <!-- কুইজ সেকশন -->
    <div id="quiz-section">
        <div class="quiz-title" id="quiz-number">কুইজ নং: ১ / ১০</div>
        <div class="question-text" id="question-text">প্রশ্ন লোড হচ্ছে...</div>
        <div id="options-container"></div>
    </div>

    <hr>

    <!-- বোনাস সেকশন -->
    <div>
        <h4 style="margin: 0 0 5px 0; color: #e8590c;">বিশেষ বোনাস টাস্ক</h4>
        <div class="sub-text">অ্যাড দেখে বোনাস পয়েন্ট অর্জন করুন</div>
        <button class="btn btn-bonus" onclick="showBonusAd()">২০ সেকেন্ডের ভিডিও (১৫ পয়েন্ট)</button>
    </div>

    <hr>

    <!-- উইথড্র সেকশন -->
    <div>
        <h4 style="margin: 0 0 5px 0; color: #2b8a3e;">টাকা উত্তোলন</h4>
        <div class="sub-text">সর্বনিম্ন উইথড্র: ৩,০০০ পয়েন্ট = ৫০ টাকা</div>
        
        <select id="method">
            <option value="bKash">বিকাশ (bKash)</option>
            <option value="Nagad">নগদ (Nagad)</option>
        </select>
        
        <input type="number" id="phone" placeholder="নম্বর দিন (যেমন: 017XXXXXXXX)">
        <button class="btn btn-withdraw" onclick="withdraw()">উইথড্র করুন</button>
    </div>
</div>

<script>
    let points = 0;
    let currentQuizIndex = 0;
    let AdController = null;

    // ১০টি নির্দিষ্ট প্রশ্ন ও ২টি করে অপশন
    const quizzes = [
        { q: "১. আমাদের দেশের নাম কি?", options: ["বাংলাদেশ", "ভারত"], ans: 0 },
        { q: "২. বাংলাদেশের রাজধানী কোনটি?", options: ["ঢাকা", "কলকাতা"], ans: 0 },
        { q: "৩. ৫ + ৫ = কত?", options: ["৮", "১০"], ans: 1 },
        { q: "৪. আমাদের জাতীয় ফুল কোনটি?", options: ["শাপলা", "গোলাপ"], ans: 0 },
        { q: "৫. ১০ - ৩ = কত?", options: ["৭", "৫"], ans: 0 },
        { q: "৬. আমাদের জাতীয় ফল কোনটি?", options: ["আম", "কাঁঠাল"], ans: 1 },
        { q: "৭. ৮ x ২ = কত?", options: ["১৬", "১৮"], ans: 0 },
        { q: "৮. সপ্তাহের শেষ দিন কোনটি?", options: ["শুক্রবার", "রবিবার"], ans: 0 },
        { q: "৯. ১৫ / ৩ = কত?", options: ["৪", "৫"], ans: 1 },
        { q: "১০. ১০০ + ২০০ = কত?", options: ["৩০০", "৩৫০"], ans: 0 }
    ];

    function loadQuiz() {
        if (currentQuizIndex >= quizzes.length) {
            currentQuizIndex = 0;
        }
        
        const qData = quizzes[currentQuizIndex];
        document.getElementById('quiz-number').innerText = `কুইজ নং: ${currentQuizIndex + 1} / ১০`;
        document.getElementById('question-text').innerText = qData.q;
        
        const optionsDiv = document.getElementById('options-container');
        optionsDiv.innerHTML = '';
        
        qData.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-quiz-opt';
            btn.innerText = opt;
            btn.onclick = function() { checkAnswer(index); };
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex) {
        const correctIndex = quizzes[currentQuizIndex].ans;
        
        if (selectedIndex === correctIndex) {
            points += 10;
            document.getElementById('user-points').innerText = points;
            alert('সঠিক উত্তর! ১০ পয়েন্ট যোগ হয়েছে।');
        } else {
            alert('ভুল উত্তর! কোনো পয়েন্ট যোগ হয়নি।');
        }

        // উত্তর সঠিক বা ভুল যা-ই হোক, Adsgram ভিডিও শো হবে
        playAdsgramAd(() => {
            currentQuizIndex++;
            loadQuiz();
        });
    }

    function playAdsgramAd(callback) {
        if (AdController) {
            AdController.show().then(() => {
                if (callback) callback();
            }).catch((err) => {
                if (callback) callback();
            });
        } else {
            if (callback) callback();
        }
    }

    function showBonusAd() {
        if (AdController) {
            AdController.show().then(() => {
                points += 15;
                document.getElementById('user-points').innerText = points;
                alert('ধন্যবাদ! ২০ সেকেন্ডের ভিডিও দেখার জন্য ১৫ পয়েন্ট যোগ হয়েছে।');
            }).catch(() => {
                alert('ভিডিওটি সম্পূর্ণ দেখতে হবে।');
            });
        } else {
            alert('বিজ্ঞাপন এই মুহূর্তে লোড হয়নি, একটু পর চেষ্টা করুন।');
        }
    }

    function withdraw() {
        const phone = document.getElementById('phone').value;
        const method = document.getElementById('method').value;

        if (points < 3000) {
            alert('পয়েন্ট অপর্যাপ্ত! উইথড্র করতে কমপক্ষে ৩,০০০ পয়েন্ট প্রয়োজন।');
            return;
        }
        if (phone.length !== 11) {
            alert('দয়া করে ১১ ডিজিটের সঠিক মোবাইল নম্বর দিন।');
            return;
        }

        alert(`আপনার ${method} নম্বর (${phone})-এ ৫০ টাকা উইথড্র রিকোয়েস্ট সফলভাবে জমা হয়েছে!`);
        points -= 3000;
        document.getElementById('user-points').innerText = points;
    }

    // অ্যাপ লোড হওয়ার সাথে সাথে কুইজ ও বিজ্ঞাপন তৈরি হবে
    window.onload = function() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        if (window.Adsgram) {
            AdController = window.Adsgram.init({ blockId: "44878" });
        }

        loadQuiz();
    };
</script>
</body>
    </html>
