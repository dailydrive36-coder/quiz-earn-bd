  <!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Earn BD</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad-index.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1c2733;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #24303f;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .score-board {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            background: #17212b;
            padding: 10px;
            border-radius: 8px;
        }
        .question-box {
            font-size: 18px;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #2b5278;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option-btn:hover {
            background-color: #3b6e9e;
        }
        .ad-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .ad-btn:hover {
            background-color: #00aaff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>QuizEarn BD</h2>
    
    <div class="score-board">
        পয়েন্ট: <span id="score">0</span> | কুইজ: <span id="quiz-count">1</span>
    </div>

    <div class="question-box" id="question">
        প্রশ্ন লোড হচ্ছে...
    </div>

    <div class="options-grid" id="options-container">
        <!-- অপশনগুলো অটো আসবে -->
    </div>

    <button class="ad-btn" onclick="showAd()">বিজ্ঞাপন দেখে ৫০ পয়েন্ট পান</button>
</div>

<script>
    window.Telegram.WebApp.ready();
    
    let AdController;
    try {
        AdController = window.Adsgram.init({ blockId: "44859" });
    } catch(e) {
        console.log("Adsgram Init Error", e);
    }

    // ১০টি মানসম্মত মানসম্পন্ন কুইজ (প্রতিটিতে ২টি করে অপশন)
    const quizData = [
        {
            "question": "বাংলাদেশের একমাত্র প্রবাল দ্বীপ কোনটি?",
            "options": ["সেন্ট মার্টিন", "মহেশখালী"],
            "correct": 0
        },
        {
            "question": "সংবিধান অনুযায়ী বাংলাদেশের আইনসভার নাম কি?",
            "options": ["জাতীয় সংসদ", "গণপরিষদ"],
            "correct": 0
        },
        {
            "question": "বিশ্বের সবচেয়ে দীর্ঘতম প্রাকৃতিক সমুদ্র সৈকত কোনটি?",
            "options": ["কক্সবাজার", "কুয়াকাটা"],
            "correct": 0
        },
        {
            "question": "বাংলাদেশের সবচেয়ে ছোট প্রশাসনিক বিভাগ কোনটি?",
            "options": ["ময়মনসিংহ", "সিলেট"],
            "correct": 0
        },
        {
            "question": "বাংলাদেশ কত সালে জাতিসংঘের সদস্যপদ লাভ করে?",
            "options": ["১৯৭৪ সালে", "১৯৭২ সালে"],
            "correct": 0
        },
        {
            "question": "মানবদেহের বৃহত্তম অঙ্গ কোনটি?",
            "options": ["ত্বক (Skin)", "যকৃৎ (Liver)"],
            "correct": 0
        },
        {
            "question": "নোবেল পুরস্কার প্রদান শুরু হয় কত সাল থেকে?",
            "options": ["১৯০১ সাল", "১৯০৫ সাল"],
            "correct": 0
        },
        {
            "question": "মহাকাশে পাঠানো প্রথম কৃত্রিম উপগ্রহ কোনটি?",
            "options": ["স্পুটনিক-১", "অ্যাপোলো-১১"],
            "correct": 0
        },
        {
            "question": "কম্পিউটারের অস্থায়ী মেমোরি (Temporary Memory) কোনটি?",
            "options": ["RAM", "ROM"],
            "correct": 0
        },
        {
            "question": "সূর্যের আলোর কোন রশ্মি থেকে ভিটামিন ডি পাওয়া যায়?",
            "options": ["অতিবেগুনি রশ্মি (Ultraviolet)", "ইনফ্রারেড রশ্মি"],
            "correct": 0
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionEl = document.getElementById('question');
    const optionsContainer = document.getElementById('options-container');
    const scoreEl = document.getElementById('score');
    const quizCountEl = document.getElementById('quiz-count');

    function loadQuiz() {
        optionsContainer.innerHTML = '';
        const currentQuiz = quizData[currentQuestionIndex];
        
        questionEl.innerText = `${currentQuestionIndex + 1}. ${currentQuiz.question}`;
        quizCountEl.innerText = `${currentQuestionIndex + 1}/${quizData.length}`;

        currentQuiz.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option-btn');
            button.onclick = () => selectOption(index);
            optionsContainer.appendChild(button);
        });
    }

    function selectOption(selectedIndex) {
        const currentQuiz = quizData[currentQuestionIndex];
        
        if (selectedIndex === currentQuiz.correct) {
            score += 10;
            scoreEl.innerText = score;
            alert("সঠিক উত্তর! ১০ পয়েন্ট যোগ হয়েছে।");
        } else {
            alert("ভুল উত্তর! সঠিক উত্তর ছিল: " + currentQuiz.options[currentQuiz.correct]);
        }

        // প্রতি ৫টি কুইজ পর পর অটো বিজ্ঞাপন পপআপ
        if ((currentQuestionIndex + 1) % 5 === 0) {
            showAd();
        }

        currentQuestionIndex++;
        
        if (currentQuestionIndex < quizData.length) {
            loadQuiz();
        } else {
            currentQuestionIndex = 0;
            loadQuiz();
        }
    }

    function showAd() {
        if (AdController) {
            AdController.show().then((result) => {
                score += 50;
                scoreEl.innerText = score;
                alert("বিজ্ঞাপন সফলভাবে দেখেছেন! ৫০ পয়েন্ট যুক্ত হলো।");
            }).catch((result) => {
                console.log("Ad Error or closed: ", result);
            });
        }
    }

    loadQuiz();
</script>

</body>
</html>
