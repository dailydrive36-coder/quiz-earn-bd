<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizEarn BD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e293b; color: white; margin: 0; padding: 20px; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); max-width: 400px; margin: 0 auto; }
        .score-box { background: #334155; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
        .btn { background: #22c55e; color: white; border: none; padding: 12px 20px; margin: 8px 0; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:hover { background: #16a34a; }
        .withdraw-btn { background: #eab308; color: black; }

        /* Ad Overlay Styling */
        #ad-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .ad-box { background: #1e293b; padding: 25px; border-radius: 12px; text-align: center; max-width: 300px; width: 80%; border: 1px solid #334155; }
        .timer { font-size: 14px; color: #94a3b8; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>QuizEarn BD</h2>
        <div class="score-box">আপনার পয়েন্ট: <span id="pts">0</span></div>

        <h3 id="q-text">প্রশ্ন লোড হচ্ছে...</h3>
        <div id="options"></div>

        <hr style="border-color: #334155; margin: 20px 0;">
        <button class="btn withdraw-btn" onclick="openWithdraw()">টাকা তুলুন (Withdraw)</button>
        <button class="btn" style="background: #3b82f6;" onclick="showAd()">বিজ্ঞাপন দেখে পয়েন্ট নিন (Watch Ad)</button>
    </div>

    <script>
        let p = 0;

        function loadQuestion() {
            document.getElementById('q-text').innerText = "বাংলাদেশের রাজধানী কোথায়?";
            const opts = document.getElementById('options');
            opts.innerHTML = '';
            
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'ঢাকা';
            btn.onclick = function() {
                p += 10;
                document.getElementById('pts').innerText = p;
                alert('সঠিক উত্তর! ১০ পয়েন্ট যোগ হয়েছে।');
            };
            opts.appendChild(btn);
        }

        function showTimerModal(callback) {
            const modal = document.createElement('div');
            modal.id = 'ad-modal';
            modal.innerHTML = `
                <div class="ad-box">
                    <h3>বিজ্ঞাপন দেখানো হচ্ছে...</h3>
                    <p class="timer">অনুগ্রহ করে <span id="ad-timer">5</span> সেকেন্ড অপেক্ষা করুন</p>
                </div>
            `;
            document.body.appendChild(modal);

            const timerEl = document.getElementById('ad-timer');
            let timeLeft = 5;

            modal.style.display = 'flex';
            timerEl.innerText = timeLeft;

            let interval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    modal.style.display = 'none';
                    callback();
                }
            }, 1000);
        }

        function openWithdraw() {
            if (p < 100) {
                alert('উইথড্র করতে সর্বনিম্ন ১০০ পয়েন্ট লাগবে।');
            } else {
                let number = prompt('টাকা নিতে আপনার বিকাশ/নগদ নম্বর দিন:');
                if (number) {
                    alert('আপনার উইথড্র রিকোয়েস্ট জমা হয়েছে!');
                    p = 0;
                    document.getElementById('pts').innerText = p;
                }
            }
        }

        loadQuestion();

        // Adsgram Ad Integration
        const AdController = window.Adsgram.init({ blockId: "44859" });

        function showAd() {
            AdController.show().then((result) => {
                alert("বিজ্ঞাপন দেখা সম্পন্ন হয়েছে! পয়েন্ট যোগ করা হলো।");
            }).catch((error) => {
                console.log("Ad error or closed:", error);
            });
        }
    </script>
</body>
</html>bAp
